{% extends "page.html" %}

{% block headers %}
  <!-- Syntax highlighting palettes, generated by Zola from highlight_themes. -->
  <link rel="stylesheet" type="text/css" href="/giallo-light.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" type="text/css" href="/giallo-dark.css" media="(prefers-color-scheme: dark)" />
  <!-- Normalizes MathML rendering across browsers. -->
  <link rel="stylesheet" type="text/css" href="/mathml.css" />
{% endblock %}

{% block posttitle %}
<div class="pubinfo" >
  {{ page.authors[0] }} - {{ page.date | date(format="%B %e, %Y") }}
</div>
{% endblock %}

{% block content %}
{{ page.content | safe }}
{% endblock %}
